<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
    <!-- Latar Belakang Abu-abu Terang -->
    <rect width="600" height="800" fill="#F3F4F6"/>
    
    <!-- Garis Tepi (Border) -->
    <rect x="40" y="40" width="520" height="720" fill="none" stroke="#E5E7EB" stroke-width="4" rx="24"/>
    
    <!-- Pola Abstrak Tipis sebagai Ornamen -->
    <circle cx="600" cy="0" r="250" fill="#E5E7EB" opacity="0.4"/>
    <circle cx="0" cy="800" r="300" fill="#E5E7EB" opacity="0.4"/>

    <!-- Ikon Dokumen / Buku (Posisi diturunkan agar lebih ke tengah) -->
    <g transform="translate(236, 330)" fill="none" stroke="#9CA3AF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 32v104c0 0 32-16 60-16s60 16 60 16V32c0 0-32-16-60-16S4 32 4 32z"/>
        <path d="M64 16v104"/>
    </g>

    <!-- Logo/Teks Kecil di Bawah -->
    <text x="300" y="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#D1D5DB" text-anchor="middle" letter-spacing="4">
        UPT PERPUSTAKAAN USTJ
    </text>
</svg>
